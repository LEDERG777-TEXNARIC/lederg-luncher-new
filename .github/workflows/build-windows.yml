name: Windows launcher
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep canonical source line endings
        run: git config core.autocrlf false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: "x64"
      - run: python -m pip install -r requirements.txt
      - run: python tools/update_runtime_manifest.py
      - run: git diff --exit-code -- runtime-manifest.json
      - name: Prepare verified DirectX 9 legacy dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $expectedHash = "4c54df27ce84d21b2924e64ff79b13e7876ce85d8e0c9c1d0abd8da73888187a"
          $redist = Join-Path $env:RUNNER_TEMP "directx_Jun2010_redist.exe"
          $unpack = Join-Path $env:RUNNER_TEMP "directx_Jun2010_redist"
          $url = "https://download.microsoft.com/download/8/4/A/84A35BF1-DAFE-4AE8-82AF-AD2AE20B6B14/directx_Jun2010_redist.exe"
          Invoke-WebRequest -Uri $url -OutFile $redist
          $signature = Get-AuthenticodeSignature $redist
          if ($signature.Status -ne "Valid" -or $signature.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
            throw "The DirectX redistributable signature is not valid Microsoft code."
          }
          New-Item -ItemType Directory -Force -Path $unpack, (Join-Path $PWD "dependencies") | Out-Null
          Start-Process -FilePath $redist -ArgumentList @("/Q", ("/T:" + $unpack)) -Wait -NoNewWindow
          $cab = Join-Path $unpack "Apr2005_d3dx9_25_x86.cab"
          if (!(Test-Path $cab)) { throw "Required x86 DirectX CAB was not extracted." }
          & expand.exe -F:d3dx9_25.dll $cab (Join-Path $PWD "dependencies")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = Join-Path $PWD "dependencies\d3dx9_25.dll"
          $actualHash = (Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "d3dx9_25.dll SHA-256 mismatch: $actualHash" }
          $dllSignature = Get-AuthenticodeSignature $dll
          if ($dllSignature.Status -ne "Valid" -or $dllSignature.SignerCertificate.Subject -notmatch "Microsoft Corporation") {
            throw "Extracted d3dx9_25.dll signature is not valid Microsoft code."
          }
          Write-Host "Verified d3dx9_25.dll ($actualHash)"
      - run: python -m unittest discover -v
      - name: Build x86 direct-connect helper
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if (!(Test-Path $compiler)) { throw "The .NET Framework C# compiler is not installed." }
          & $compiler /nologo /platform:x86 /target:exe /out:LEDERG-DirectLaunch.exe direct_launcher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "LEDERG-DirectLaunch.exe")) { throw "Direct-connect helper was not produced." }
      - run: pyinstaller --clean --noconfirm "LEDERG CRMP.spec"
      - uses: actions/upload-artifact@v4
        with:
          name: LEDERG-CRMP-Launcher-Windows-x64
          path: dist/LEDERG CRMP.exe
          if-no-files-found: error
      - name: Publish launcher release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.1.4-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: LEDERG CR:MP Launcher ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v2.1.4-{0}', github.run_number) }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: dist/LEDERG CRMP.exe
