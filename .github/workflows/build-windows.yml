name: Windows launcher
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep canonical source line endings
        run: git config core.autocrlf false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          architecture: "x64"
      - run: python -m pip install -r requirements.txt
      - run: python tools/update_runtime_manifest.py
      - run: git diff --exit-code -- runtime-manifest.json
      - run: python -m unittest discover -v
      - name: Generate LEDERG application icon
        run: |
          python -m pip install Pillow
          python tools/generate_icon.py
      - name: Build x86 direct-connect helper
        shell: pwsh
        run: |
          $compiler = Join-Path $env:WINDIR "Microsoft.NET\Framework\v4.0.30319\csc.exe"
          if (!(Test-Path $compiler)) { throw "The .NET Framework C# compiler is not installed." }
          & $compiler /nologo /platform:x86 /target:exe /out:LEDERG-DirectLaunch.exe direct_launcher.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "LEDERG-DirectLaunch.exe")) { throw "Direct-connect helper was not produced." }
      - run: pyinstaller --clean --noconfirm "LEDERG CRMP.spec"
      - name: Package source code, EXE cover, and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist" | Out-Null
          Copy-Item "dist/LEDERG CRMP.exe" "dist/LEDERG.CRMP.exe" -Force
          Copy-Item "LEDERG-CRMP-Avatar.ico" "dist/LEDERG-CRMP-Avatar.ico" -Force
          Copy-Item "LEDERG-CRMP-Cover.png" "dist/LEDERG-CRMP-Cover.png" -Force
          python tools/package_release.py
          $source = Get-ChildItem "dist/LEDERG-CRMP-Source-v*.zip" | Select-Object -First 1
          if (!$source) { throw "Source archive was not created." }
          $files = @("dist/LEDERG.CRMP.exe", $source.FullName, "dist/LEDERG-CRMP-Avatar.ico", "dist/LEDERG-CRMP-Cover.png")
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $file)"
          }
          $lines | Set-Content -LiteralPath "dist/LEDERG-CRMP-SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: LEDERG-CRMP-Release-Package
          path: |
            dist/LEDERG.CRMP.exe
            dist/LEDERG-CRMP-Source-v*.zip
            dist/LEDERG-CRMP-Avatar.ico
            dist/LEDERG-CRMP-Cover.png
            dist/LEDERG-CRMP-SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release asset
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifest = Get-Content "runtime-manifest.json" -Raw | ConvertFrom-Json
          $tag = "v$($manifest.version)"
          $source = Get-ChildItem "dist/LEDERG-CRMP-Source-v*.zip" | Select-Object -First 1
          $assets = @(
            "dist/LEDERG.CRMP.exe",
            $source.FullName,
            "dist/LEDERG-CRMP-Avatar.ico",
            "dist/LEDERG-CRMP-Cover.png",
            "dist/LEDERG-CRMP-SHA256SUMS.txt"
          )
          if (!$source) { throw "Source archive is missing from the release package." }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "LEDERG CR:MP Launcher $tag" --notes "Windows x64 LEDERG launcher. Assets include the compiled EXE, full tracked source package with tests and build workflow, PNG cover, ICO application icon, and SHA-256 checksums. The source package excludes binaries, databases, backups, logs, and credentials."
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "LEDERG CR:MP Launcher $tag" --notes "Windows x64 LEDERG launcher. Assets include the compiled EXE, full tracked source package with tests and build workflow, PNG cover, ICO application icon, and SHA-256 checksums. The source package excludes binaries, databases, backups, logs, and credentials."
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
